[project]
name = "packet-analyzer"
version = "0.1.0"
description = "My own RAG project that analyzes network packets"
authors = [
    {name = "Haard Shah",email = "haard.shah2004@gmail.com"}
]
requires-python = ">=3.10,<4.0.0"
dependencies = [
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "structured-docx-loader (>=0.1.0,<0.2.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "onnxruntime (==1.23.0)",
    "langchain-groq (>=1.1.3,<2.0.0)",
    "langchain-chroma (>=1.1.0,<2.0.0)",
    "langchain-huggingface (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
