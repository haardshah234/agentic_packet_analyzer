[project]
name = "packet-analyser"
version = "0.1.0"
description = "My own RAG project that analyses network packets"
authors = [
    {name = "Haard Shah",email = "haard.shah2004@gmail.com"}
]
requires-python = ">=3.15,<4.0.0"
dependencies = [
    "langchain (>=1.4.7,<2.0.0)",
    "langchain-text-splitters (>=1.1.3,<2.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "structured-docx-loader (>=0.1.0,<0.2.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
